<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>FORTRESS. by Raisen</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         Las llamadas a la API de Claude salen del proceso main (Node), nunca
         del renderer: por eso no hace falta abrir connect-src a api.anthropic.com.
         base-uri y form-action NO heredan de default-src y hay que declararlas
         aparte: sin ellas, un HTML inyectado podria reescribir de donde cuelgan
         las rutas relativas o enviar un formulario fuera de la app.
         style-src lleva 'unsafe-inline' SOLO en desarrollo: en `npm run dev`
         electron-vite inyecta las hojas con recarga en caliente como etiquetas
         style dentro del documento, y sin esa relajacion la interfaz de dev se
         queda sin estilos (error de CSP en consola, no fallo de compilacion, asi
         que ni typecheck ni lint lo verian). En el empaquetado no la consume
         nadie: la hoja se sirve como archivo externo del mismo origen enlazado
         desde head, que ya cubre 'self', y las medidas calculadas de los
         componentes se aplican por el objeto style de React, via programatica
         que style-src no intercepta. Este archivo es unico para los dos
         entornos, asi que la politica se elige aqui copiando la guarda de
         loadRenderer (main-window.ts): el servidor de electron-vite sirve por
         http(s) y el binario del operador entra siempre por loadFile, o sea por
         file://. Produccion es la rama por defecto y desarrollo la excepcion, de
         modo que ninguna variable de entorno puede colar la relajacion dentro
         del paquete. Se emite con document.write para que la meta la inserte el
         parser, igual que si estuviera escrita a mano, antes de que cargue nada
         mas; el script en linea corre cuando todavia no hay politica, por eso
         script-src 'self' no le afecta. -->
    <script>
      const devServer = location.protocol === 'http:' || location.protocol === 'https:'
      const styleSrc = devServer ? "style-src 'self' 'unsafe-inline'" : "style-src 'self'"
      const policy = [
        "default-src 'self'",
        "script-src 'self'",
        styleSrc,
        "img-src 'self' data:",
        "font-src 'self' data:",
        "base-uri 'none'",
        "form-action 'none'"
      ].join('; ')
      document.write('<meta http-equiv="Content-Security-Policy" content="' + policy + '">')
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
