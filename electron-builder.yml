appId: com.fortress.command-center
productName: 'FORTRESS. by Raisen'
directories:
  # Fuera del proyecto: el build queda en ~/Escritorio/Raisen_FCC/dist/
  output: ../dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Documentacion interna: no viaja en el instalable (el asar se extrae con
  # `npx asar extract`). Que el .gitignore la excluya del repo NO basta: son
  # capas distintas y cada una declara la suya (ver docs/DECISIONS/ADR-058).
  - '!internal/**'
  # Kit universal: se distribuye a proyectos, no viaja en el binario.
  - '!templates/**'
  # Documentacion versionada (ADR, DEUDAS, ROADMAP...): la app no la lee.
  - '!docs/**'
  # Configuracion del operador y del agente: no versionada o a medias.
  - '!.claude/**'
  - '!.fortress/**'
  - '!.vscode/**'
  # Recursos de empaquetado (iconos, entitlements): los lee electron-builder
  # desde fuera; en tiempo de ejecucion el icono sale de resources/.
  - '!build/**'
  - '!*.tsbuildinfo'
  # Familias de la raiz que .gitignore deja fuera del repo (documentos y
  # scripts del operador, secretos, bases de datos locales) y config de MCP.
  # Sin '**/' a proposito: estas negaciones tambien filtran node_modules y
  # minimatch sin matchBase ancla '*.ext' a la raiz. Por extension y no por
  # nombre, para que un fichero nuevo de la misma familia no entre en silencio.
  - '!*.md'
  - '!*.sh'
  - '!*.png'
  - '!*.{pem,key,p12,keystore}'
  - '!*.{db,db-shm,db-wal,sqlite,sqlite3}'
  - '!DOSSIER/**'
  - '!.mcp.json'
  # Documentos del operador que viven en la raiz. Los que se movieron a
  # internal/ ya no se nombran aqui: los cubre el patron de arriba.
  - '!{CLAUDE.md,CONSTITUCION.md,COGNITION-LOG.md}'
  - '!.ui-preview*.png'
  - '!.render-smoke.png'
  - '!install.sh'
asarUnpack:
  - resources/**
  # Modulo nativo: el .node debe quedar fuera del asar para poder cargarse
  - '**/node_modules/better-sqlite3/**'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # Firma Developer ID + notarizacion: sin ellas Gatekeeper bloquea el .app y
  # nadie puede comprobar que no se altero tras el build. Las credenciales
  # entran por entorno al compilar, nunca en el repo (R1): CSC_LINK y
  # CSC_KEY_PASSWORD; APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID
  # (o APPLE_API_KEY). Sin ellas el build falla en vez de salir sin firmar.
  forceCodeSigning: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: FORTRESS-${version}.${ext}
linux:
  target:
    - AppImage
  icon: build/icon.png
  executableName: fortress
  category: Development
  maintainer: raisenomega
  synopsis: Centro de mando para auditar proyectos con agentes de IA
  # Toma desktopName de package.json. Sin esto el escritorio no asocia la
  # ventana con el .desktop y la barra de aplicaciones da un icono generico.
  syncDesktopName: true
  desktop:
    entry:
      Name: 'FORTRESS. by Raisen'
      Comment: Centro de mando FORTRESS
      Categories: Development;
      StartupWMClass: fortress-command-center
appImage:
  artifactName: FORTRESS-${version}.${ext}
win:
  target:
    - nsis
    - portable
  executableName: fortress
  icon: build/icon.ico
nsis:
  artifactName: FORTRESS-${version}-setup.${ext}
  shortcutName: FORTRESS
  uninstallDisplayName: 'FORTRESS. by Raisen'
  createDesktopShortcut: always
npmRebuild: false
# Sin estos fuses, ELECTRON_RUN_AS_NODE, NODE_OPTIONS o --inspect ejecutan codigo
# en el main y leen la API key de safeStorage (docs/SECURITY-MODEL.md).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
