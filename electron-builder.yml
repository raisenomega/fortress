appId: com.fortress.command-center
productName: 'FORTRESS. by Raisen'
directories:
  # Fuera del proyecto: el build queda en ~/Escritorio/Raisen_FCC/dist/
  output: ../dist
  buildResources: build
files:
  # Lista BLANCA: se declara lo que la app necesita en runtime y todo lo demas
  # queda fuera, incluido lo que todavia no existe. La lista negra anterior
  # dejaba el fondo abierto: cuando todas las entradas son negaciones,
  # electron-builder antepone '**/*' (minimatch con dot:true en fileMatcher.js)
  # y un fichero nuevo que nadie nego entraba en silencio en el asar.
  # Que el .gitignore excluya algo del repo NO basta: son capas distintas y
  # cada una declara la suya (ver docs/DECISIONS/ADR-058); la verificacion
  # sigue siendo extraer el instalable (`npx asar extract`) y mirar dentro.
  #
  # Salida de electron-vite (main, preload, renderer): el `main` de
  # package.json apunta a out/main/index.js.
  - out/**
  # Icono y logo que la app usa en tiempo de ejecucion; asarUnpack (abajo)
  # los deja fuera del asar como ficheros reales.
  - resources/**
  # electron-builder lo incluye y reescribe siempre; se nombra para que la
  # lista se lea completa. Las dependencias de produccion de node_modules
  # las anade electron-builder a partir de este fichero, no de esta lista.
  - package.json
asarUnpack:
  - resources/**
  # Modulo nativo: el .node debe quedar fuera del asar para poder cargarse
  - '**/node_modules/better-sqlite3/**'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # Firma Developer ID + notarizacion: sin ellas Gatekeeper bloquea el .app y
  # nadie puede comprobar que no se altero tras el build. Las credenciales
  # entran por entorno al compilar, nunca en el repo (R1): CSC_LINK y
  # CSC_KEY_PASSWORD; APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID
  # (o APPLE_API_KEY). Sin ellas el build falla en vez de salir sin firmar.
  forceCodeSigning: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: FORTRESS-${version}.${ext}
linux:
  target:
    - AppImage
  icon: build/icon.png
  executableName: fortress
  category: Development
  maintainer: raisenomega
  synopsis: Centro de mando para auditar proyectos con agentes de IA
  # Toma desktopName de package.json. Sin esto el escritorio no asocia la
  # ventana con el .desktop y la barra de aplicaciones da un icono generico.
  syncDesktopName: true
  desktop:
    entry:
      Name: 'FORTRESS. by Raisen'
      Comment: Centro de mando FORTRESS
      Categories: Development;
      StartupWMClass: fortress-command-center
appImage:
  artifactName: FORTRESS-${version}.${ext}
win:
  target:
    - nsis
    - portable
  executableName: fortress
  icon: build/icon.ico
  # Firma Authenticode: sin ella SmartScreen frena el instalador y nadie puede
  # comprobar que no se altero tras el build. Las credenciales entran por
  # entorno al compilar, nunca en el repo (R1): WIN_CSC_LINK y
  # WIN_CSC_KEY_PASSWORD (signtool), o el bloque azureSignOptions para Azure
  # Trusted Signing. Sin ellas el build falla en vez de salir sin firmar,
  # igual que ya hace el de mac.
  forceCodeSigning: true
nsis:
  artifactName: FORTRESS-${version}-setup.${ext}
  shortcutName: FORTRESS
  uninstallDisplayName: 'FORTRESS. by Raisen'
  createDesktopShortcut: always
npmRebuild: false
# Sin estos fuses, ELECTRON_RUN_AS_NODE, NODE_OPTIONS o --inspect ejecutan codigo
# en el main y leen la API key de safeStorage (docs/SECURITY-MODEL.md).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # Pareja de onlyLoadAppFromAsar: sin esta validacion, un app.asar editado
  # tras instalar se carga sin protesta aunque el build saliera firmado
  # (docs/SECURITY-MODEL.md, activo "integridad del propio binario").
  # Fail-closed como la firma: ante un asar alterado la app aborta al
  # arrancar en vez de cargarlo en silencio. Limites: Electron no la
  # implementa en Linux (el AppImage queda fuera) y better-sqlite3 vive en
  # asarUnpack, fuera del asar validado.
  enableEmbeddedAsarIntegrityValidation: true
  # MEDIDO 2026-10-05 (binario 56295230, pantalla negra): el renderer
  # empaquetado SI los necesita — Vite emite <script type="module"
  # crossorigin> y la carga de modulos ES por file:// muere por CORS sin
  # este fuse; la app arranca main+zygotes y jamas pinta (cero proceso
  # renderer). Vuelve a true HASTA servir el renderer por protocolo propio
  # (custom protocol), que es la via correcta de quitarle privilegios a
  # file:// sin matar la carga — seguimiento en DEUDAS.
  grantFileProtocolExtraPrivileges: true
